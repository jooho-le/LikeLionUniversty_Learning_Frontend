<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>만 나이 계산기</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100">
    <main class="mx-auto max-w-screen-xl px-4 py-16 sm:px-6 lg:px-8">
      <section class="mx-auto max-w-lg rounded-xl bg-white p-8 shadow-sm">
        <h1 class="text-center text-4xl font-bold tracking-tight text-indigo-600">
          만 나이 계산기
        </h1>

        <p class="mx-auto mt-4 max-w-md text-center text-gray-500">
          만 나이 계산을 간편하게 하기
        </p>

        <div class="mt-10 space-y-6">
          <div>
            <label for="birthday" class="text-sm font-bold text-gray-700">
              생년월일
            </label>

            <div class="mt-2">
              <input
                type="date"
                id="birthday"
                name="birthday"
                class="w-full rounded-lg border border-gray-200 bg-white px-4 py-3 text-sm text-gray-700 outline-none transition focus:border-indigo-500"
              />
            </div>
          </div>

          <div>
            <label for="result" class="text-sm font-bold text-gray-700">
              만 나이
            </label>

            <div
              id="result"
              class="mt-2 min-h-[48px] w-full rounded-lg border border-gray-200 bg-gray-50 px-4 py-3 text-sm text-gray-700"
            ></div>
          </div>

          <button
            type="button"
            id="submit"
            class="block w-full rounded-lg bg-indigo-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-indigo-700"
          >
            제출하기
          </button>
        </div>
      </section>
    </main>

    <script src="./agecalculator.js"></script>
  </body>
</html>
